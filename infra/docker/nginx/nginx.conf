worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_proxied any;
    gzip_vary on;

    # rate limiting
    # general API
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    # auth endpoints
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # WebSocket upgrade helper: only forward Connection: upgrade when the
    # client actually sent Upgrade, otherwise close so keepalive still works.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # CORS origin allowlist — echo the request Origin back only if it matches.
    map $http_origin $cors_origin {
        default                            "";
        "~^http://localhost:[0-9]+$"       $http_origin;
        "~^https://tripapp\.com$"          $http_origin;
        "~^https://www\.tripapp\.com$"     $http_origin;
    }

    upstream tripapp_api {
        server api:8080;
        keepalive 32;
    }

    upstream tripapp_web {
        server web:3002;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Secure headers
        add_header X-Content-Type-Options  "nosniff"         always;
        add_header X-Frame-Options         "DENY"            always;
        add_header X-XSS-Protection        "1; mode=block"   always;
        add_header Referrer-Policy         "strict-origin"   always;

        # CORS
        add_header Access-Control-Allow-Origin  $cors_origin                             always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID" always;
        add_header Access-Control-Max-Age       86400                                    always;

        # Preflight — return 204 for any OPTIONS request so the browser gets
        # the server-scope CORS headers above without hitting an upstream.
        if ($request_method = OPTIONS) { return 204; }

        # Liveness probe — publicly reachable for the LB.
        location = /health {
            proxy_pass         http://tripapp_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            access_log         off;
        }

        # Internal-only endpoints — never exposed at the ingress.
        location = /ready     { return 403; }
        location = /metrics   { return 403; }
        location ^~ /swagger/ { return 403; }

        # WebSocket routes on the api. Long-lived; ticket auth (issued by the
        # web BFF, single-use via Redis GETDEL) already gates who can Upgrade,
        # so no request-rate limit here.
        location ^~ /ws/ {
            proxy_pass         http://tripapp_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Auth-shaped BFF routes get the stricter zone.
        location ^~ /api/auth/ {
            limit_req          zone=auth burst=5 nodelay;
            proxy_pass         http://tripapp_web;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # BFF routes live inside the Next.js app (app/api/*) — the browser's
        # single API surface. Handlers here own the session cookie and call
        # the Go api internally over the docker network.
        location ^~ /api/ {
            limit_req          zone=api burst=20 nodelay;
            proxy_pass         http://tripapp_web;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Everything else — pages, static assets, RSC — served by Next.js.
        location / {
            proxy_pass         http://tripapp_web;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
